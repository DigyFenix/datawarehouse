# Contrato canónico — centro_costo (dimensión aparte, nivel línea, §8)
entidad: centro_costo
tipo: dimension
dominio: datos_maestros
grano: un centro de costo
empresa_scoped: true
clave_natural: [empresa_id, centro_costo_codigo]
miembro_default: { centro_costo_codigo: "DESCONOCIDO", nombre: "Centro de costo desconocido" }
campos:
  - { nombre: empresa_id,          tipo: text, requerido: true,  descripcion: "Empresa del grupo" }
  - { nombre: centro_costo_codigo, tipo: text, requerido: true,  descripcion: "Código de centro de costo en el origen" }
  - { nombre: nombre,              tipo: text, requerido: true,  descripcion: "Nombre del centro de costo" }
