version: 2

models:
  - name: dim_rango_aging
    description: >
      Rangos de antigüedad de cartera con su orden de presentación. Catálogo cerrado del motor
      (llaves fijas 1-6): los cortes 30/60/90 son los del paquete base y significan lo mismo en
      todos los tenants. Se relaciona con los hechos de cartera por `rango_aging` (texto).
    columns:
      - name: rango_aging_clave
        data_tests: [not_null, unique]
      - name: rango_aging
        description: Etiqueta que produce el `case` de los hechos de cartera. Clave de relación.
        data_tests: [not_null, unique]
      - name: rango_aging_orden
        description: Orden de presentación. Sin esto '+90' sale antes que '1-30' en los visuales.
        data_tests: [not_null]
      - name: severidad
        data_tests:
          - accepted_values: { values: [ninguna, baja, media, alta, critica, indeterminada] }

  - name: clasificacion_abc_cliente
    description: >
      Clasificación ABC (Pareto) de clientes por venta neta a terceros, calculada en el
      warehouse para que Power BI, los reportes y el futuro agente usen la MISMA definición.
      Grano: una fila por (empresa, cliente); los dos ámbitos temporales —año en curso e
      histórico— van como columnas para que la clase pueda filtrar el hecho de ventas sin
      relaciones bidireccionales.
    columns:
      - name: cliente_clave
        description: Clave de la dimensión Cliente. Única — la relación con Cliente es 1:1.
        data_tests: [not_null, unique]
      - name: clase_abc_anio
        description: A hasta el 80% acumulado del año en curso, B hasta 95%, C el resto, S sin ventas.
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: clase_abc_historico
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: ranking_anio
        data_tests: [not_null]
      - name: ranking_historico
        data_tests: [not_null]
      - name: participacion_acumulada_anio
        data_tests: [not_null]

  - name: clasificacion_abc_proveedor
    description: >
      Clasificación ABC (Pareto) de proveedores por compra neta a terceros. Espejo de
      clasificacion_abc_cliente sin columnas de margen (el hecho de compras no lo lleva).
    columns:
      - name: proveedor_clave
        description: Clave de la dimensión Proveedor. Única — la relación con Proveedor es 1:1.
        data_tests: [not_null, unique]
      - name: clase_abc_anio
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: clase_abc_historico
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: ranking_anio
        data_tests: [not_null]
      - name: participacion_acumulada_anio
        data_tests: [not_null]

  - name: clasificacion_rfm_cliente
    description: >
      Clasificación RFM (recencia · frecuencia · monto) de clientes, calculada en el warehouse
      con fecha de referencia = última venta por empresa (reproducible). Quintiles por empresa;
      ventana de 12 meses para F y M. Grano: una fila por (empresa, cliente), 1:1 con Cliente.
    columns:
      - name: cliente_clave
        data_tests: [not_null, unique]
      - name: segmento_rfm
        data_tests:
          - not_null
          - accepted_values:
              values: [campeon, leal, reciente, regular, en_riesgo, en_riesgo_valioso, dormido, sin_historial]
      - name: frecuencia_12m
        data_tests: [not_null]
      - name: monto_neto_12m
        data_tests: [not_null]

  - name: comportamiento_pago_cliente
    description: >
      Perfil de riesgo de cartera + actividad de pagos por cliente. Vencimiento ponderado por
      saldo sobre partidas ABIERTAS; pagos solo con contraparte 'cliente'. Los días reales
      factura→pago requieren la aplicación de pagos (no ingestada aún) — límite documentado.
    columns:
      - name: cliente_clave
        data_tests: [not_null, unique]
      - name: perfil_riesgo
        data_tests:
          - not_null
          - accepted_values:
              values: [sin_saldo, al_dia, vencido_leve, vencido_moderado, vencido_critico]
      - name: saldo_total
        data_tests: [not_null]

  - name: proyeccion_caja_semanal
    description: >
      Entradas (CxC) y salidas (CxP) por semana ISO de vencimiento de las partidas abiertas.
      Proyección contractual, no pronóstico. Lo vencido/sin fecha se ancla a la semana del corte.
    columns:
      - name: flujo
        data_tests:
          - not_null
          - accepted_values: { values: [entrada, salida] }
      - name: estado_vencimiento
        data_tests:
          - not_null
          - accepted_values: { values: [vencido, programado, sin_vencimiento] }
      - name: monto
        data_tests: [not_null]
      - name: semana_inicio
        data_tests: [not_null]

  - name: metrica_venta_diaria
    description: >
      Serie diaria de ventas SIN huecos por empresa (un día sin ventas es un cero, no una fila
      ausente): base única para tendencias, medias móviles y forecasting.
    columns:
      - name: ventas_netas
        data_tests: [not_null]
      - name: tiempo_clave
        data_tests: [not_null]

  - name: dim_cuenta
    description: >
      Plan de cuentas con jerarquía multinivel homologada (nivel_1..nivel_5, código y nombre):
      árbol real por FatherNum en SAP B1 (hasta 5 niveles), segmentos del código en Odoo. Los
      niveles bajo la profundidad real repiten la hoja (ragged aplanada, sin blancos en PBI).
    columns:
      - name: cuenta_clave
        data_tests: [not_null, unique]
      - name: nivel
        data_tests: [not_null]
      - name: nivel_1_nombre
        data_tests: [not_null]

  - name: hecho_pedido_linea
    description: >
      Línea de pedido de venta confirmado (ORDR/RDR1 · sale_order). El compromiso antes del
      resultado: backlog (es_abierta, cantidad_abierta, monto_abierto_local) y fill rate.
      Solo vigentes: SAP excluye cancelados en origen; Odoo solo state sale/done.
    columns:
      - name: pedido_id
        data_tests: [not_null]
      - name: cantidad
        data_tests: [not_null]
      - name: monto_sin_impuesto
        data_tests: [not_null]
      - name: estado_linea
        data_tests:
          - not_null
          - accepted_values: { values: [abierta, cerrada] }

  - name: hecho_movimiento_contable
    description: >
      Partida del mayor en cuenta de RESULTADOS (ingreso/gasto/costo): el P&L operativo por
      cuenta (con jerarquía de 5 niveles) y centro de costo. monto_resultado va en la
      naturaleza de la cuenta (ingreso positivo al abonar, gasto positivo al cargar).
    columns:
      - name: partida_id
        data_tests: [not_null]
      - name: naturaleza
        data_tests:
          - not_null
          - accepted_values: { values: [ingreso, gasto, costo] }
      - name: monto_resultado
        data_tests: [not_null]

  - name: campo_usuario
    description: >
      Campos de usuario (UDF) en formato largo: una fila por registro × campo × valor,
      expandidos automáticamente del jsonb de Bronce (U_* en SAP, x_* en Odoo). Las claves
      sustitutas resueltas permiten relacionar en Power BI sin tocar las tablas estándar.
    columns:
      - name: campo
        data_tests: [not_null]
      - name: valor
        data_tests: [not_null]

  - name: hecho_inventario
    description: Existencias y valor por (empresa, almacén, producto). Foto a la fecha de corte.
    columns:
      - name: cantidad
        data_tests: [not_null]

  - name: hecho_pago_recibido
    description: Documento de pago recibido (cobro). Grano documento; dominio tesorería.
    columns:
      - name: pago_id
        data_tests: [not_null]
      - name: monto
        data_tests: [not_null]

  - name: hecho_pago_efectuado
    description: Documento de pago a proveedor. Grano documento; dominio tesorería.
    columns:
      - name: pago_id
        data_tests: [not_null]
      - name: monto
        data_tests: [not_null]

  # Los hechos de cartera solo pueden producir etiquetas que existan en la dimensión: si el
  # `case` del hecho y el catálogo se desincronizan, el aging pierde filas al relacionar.
  - name: hecho_cartera_cobrar
    columns:
      - name: rango_aging
        data_tests:
          - relationships:
              to: ref('dim_rango_aging')
              field: rango_aging

  - name: hecho_cartera_pagar
    columns:
      - name: rango_aging
        data_tests:
          - relationships:
              to: ref('dim_rango_aging')
              field: rango_aging
