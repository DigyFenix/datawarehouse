version: 2

models:
  - name: dim_rango_aging
    description: >
      Rangos de antigüedad de cartera con su orden de presentación. Catálogo cerrado del motor
      (llaves fijas 1-6): los cortes 30/60/90 son los del paquete base y significan lo mismo en
      todos los tenants. Se relaciona con los hechos de cartera por `rango_aging` (texto).
    columns:
      - name: rango_aging_clave
        data_tests: [not_null, unique]
      - name: rango_aging
        description: Etiqueta que produce el `case` de los hechos de cartera. Clave de relación.
        data_tests: [not_null, unique]
      - name: rango_aging_orden
        description: Orden de presentación. Sin esto '+90' sale antes que '1-30' en los visuales.
        data_tests: [not_null]
      - name: severidad
        data_tests:
          - accepted_values: { values: [ninguna, baja, media, alta, critica, indeterminada] }

  - name: clasificacion_abc_cliente
    description: >
      Clasificación ABC (Pareto) de clientes por venta neta a terceros, calculada en el
      warehouse para que Power BI, los reportes y el futuro agente usen la MISMA definición.
      Grano: una fila por (empresa, AÑO, cliente). Antes era una fila por cliente con los
      ámbitos en columnas y sin relación con el tiempo: al filtrar un año pasado se devolvía
      la clasificación del último año procesado. La clase vigente se desnormaliza en
      `dim_cliente.clase_abc_actual` mediante post_hook.
    columns:
      - name: anio_clave
        description: Clave de la dimensión Año. Es la vía por la que la clasificación se acota en el tiempo.
        data_tests: [not_null]
      - name: cliente_clave
        data_tests: [not_null]
      - name: clase_abc
        description: A hasta el 80% acumulado del año, B hasta 95%, C el resto, S sin ventas.
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: ranking
        data_tests: [not_null]
      - name: participacion_acumulada
        data_tests: [not_null]
      - name: es_perdido
        data_tests: [not_null]
  - name: clasificacion_abc_proveedor
    description: >
      Espejo del ABC de clientes sobre compras, con grano (empresa, AÑO, proveedor). Sin margen
      —la compra no lo tiene— y con `es_inactivo` en lugar de `es_perdido`. La clase vigente se
      desnormaliza en `dim_proveedor.clase_abc_actual` mediante post_hook.
    columns:
      - name: anio_clave
        data_tests: [not_null]
      - name: proveedor_clave
        data_tests: [not_null]
      - name: clase_abc
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: ranking
        data_tests: [not_null]
      - name: es_inactivo
        data_tests: [not_null]
  - name: clasificacion_rfm_cliente
    description: >
      Clasificación RFM (recencia · frecuencia · monto) de clientes, calculada en el warehouse
      con fecha de referencia = última venta por empresa (reproducible). Quintiles por empresa;
      ventana de 12 meses para F y M. Grano: una fila por (empresa, cliente), 1:1 con Cliente.
    columns:
      - name: cliente_clave
        data_tests: [not_null, unique]
      - name: segmento_rfm
        data_tests:
          - not_null
          - accepted_values:
              values: [campeon, leal, reciente, regular, en_riesgo, en_riesgo_valioso, dormido, sin_historial]
      - name: frecuencia_12m
        data_tests: [not_null]
      - name: monto_neto_12m
        data_tests: [not_null]

  - name: comportamiento_pago_cliente
    description: >
      Perfil de riesgo de cartera + actividad de pagos por cliente. Vencimiento ponderado por
      saldo sobre partidas ABIERTAS; pagos solo con contraparte 'cliente'. Los días reales
      factura→pago requieren la aplicación de pagos (no ingestada aún) — límite documentado.
    columns:
      - name: cliente_clave
        data_tests: [not_null, unique]
      - name: perfil_riesgo
        data_tests:
          - not_null
          - accepted_values:
              values: [sin_saldo, al_dia, vencido_leve, vencido_moderado, vencido_critico]
      - name: saldo_total
        data_tests: [not_null]

  - name: proyeccion_caja_semanal
    description: >
      Entradas (CxC) y salidas (CxP) por semana ISO de vencimiento de las partidas abiertas.
      Proyección contractual, no pronóstico. Lo vencido/sin fecha se ancla a la semana del corte.
    columns:
      - name: flujo
        data_tests:
          - not_null
          - accepted_values: { values: [entrada, salida] }
      - name: estado_vencimiento
        data_tests:
          - not_null
          - accepted_values: { values: [vencido, programado, sin_vencimiento] }
      - name: monto
        data_tests: [not_null]
      - name: semana_inicio
        data_tests: [not_null]

  - name: metrica_venta_diaria
    description: >
      Serie diaria de ventas SIN huecos por empresa (un día sin ventas es un cero, no una fila
      ausente): base única para tendencias, medias móviles y forecasting.
    columns:
      - name: ventas_netas
        data_tests: [not_null]
      - name: tiempo_clave
        data_tests: [not_null]

  - name: dim_cuenta
    description: >
      Plan de cuentas con jerarquía multinivel homologada (nivel_1..nivel_5, código y nombre):
      árbol real por FatherNum en SAP B1 (hasta 5 niveles), segmentos del código en Odoo. Los
      niveles bajo la profundidad real repiten la hoja (ragged aplanada, sin blancos en PBI).
    columns:
      - name: cuenta_clave
        data_tests: [not_null, unique]
      - name: nivel
        data_tests: [not_null]
      - name: nivel_1_nombre
        data_tests: [not_null]

  - name: hecho_pedido_linea
    description: >
      Línea de pedido de venta confirmado (ORDR/RDR1 · sale_order). El compromiso antes del
      resultado: backlog (es_abierta, cantidad_abierta, monto_abierto_local) y fill rate.
      Solo vigentes: SAP excluye cancelados en origen; Odoo solo state sale/done.
    columns:
      - name: pedido_id
        data_tests: [not_null]
      - name: cantidad
        data_tests: [not_null]
      - name: monto_sin_impuesto
        data_tests: [not_null]
      - name: estado_linea
        data_tests:
          - not_null
          - accepted_values: { values: [abierta, cerrada] }

  - name: hecho_movimiento_contable
    description: >
      Partida del mayor en cuenta de RESULTADOS (ingreso/gasto/costo): el P&L operativo por
      cuenta (con jerarquía de 5 niveles) y centro de costo. monto_resultado va en la
      naturaleza de la cuenta (ingreso positivo al abonar, gasto positivo al cargar).
    columns:
      - name: partida_id
        data_tests: [not_null]
      - name: naturaleza
        data_tests:
          - not_null
          - accepted_values: { values: [ingreso, gasto, costo] }
      - name: monto_resultado
        data_tests: [not_null]

  - name: campo_usuario
    description: >
      Campos de usuario (UDF) en formato largo: una fila por registro × campo × valor,
      expandidos automáticamente del jsonb de Bronce (U_* en SAP, x_* en Odoo). Las claves
      sustitutas resueltas permiten relacionar en Power BI sin tocar las tablas estándar.
    columns:
      - name: campo
        data_tests: [not_null]
      - name: valor
        data_tests: [not_null]

  - name: hecho_inventario
    description: Existencias y valor por (empresa, almacén, producto). Foto a la fecha de corte.
    columns:
      - name: cantidad
        data_tests: [not_null]

  - name: hecho_pago_recibido
    description: Documento de pago recibido (cobro). Grano documento; dominio tesorería.
    columns:
      - name: pago_id
        data_tests: [not_null]
      - name: monto
        data_tests: [not_null]

  - name: hecho_pago_efectuado
    description: Documento de pago a proveedor. Grano documento; dominio tesorería.
    columns:
      - name: pago_id
        data_tests: [not_null]
      - name: monto
        data_tests: [not_null]

  # Los hechos de cartera solo pueden producir etiquetas que existan en la dimensión: si el
  # `case` del hecho y el catálogo se desincronizan, el aging pierde filas al relacionar.
  - name: hecho_cartera_cobrar
    columns:
      - name: rango_aging
        data_tests:
          - relationships:
              to: ref('dim_rango_aging')
              field: rango_aging

  - name: hecho_cartera_pagar
    columns:
      - name: rango_aging
        data_tests:
          - relationships:
              to: ref('dim_rango_aging')
              field: rango_aging

  - name: analisis_producto
    description: >
      Ficha analítica del producto: cruza demanda (12 meses de venta) contra existencia actual
      para encontrar inventario muerto y quiebres de stock. Grano: una fila por (empresa,
      producto), 1:1 con la dimensión Producto. `es_ocioso` exige historia de venta previa;
      el producto con existencia que nunca se facturó va en `es_sin_rotacion_comercial`,
      porque en una empresa productora es insumo normal, no mercadería estancada.
    columns:
      - name: producto_clave
        description: Clave de la dimensión Producto. Única — la relación es 1:1.
        data_tests: [not_null, unique]
      - name: clase_abc_producto
        description: >
          Pareto sobre la venta de 12 meses. A diferencia del ABC de clientes, se calcula sobre
          la venta TOTAL: un producto vendido al grupo consume bodega y rota igual.
        data_tests:
          - not_null
          - accepted_values: { values: [A, B, C, S] }
      - name: estado_producto
        data_tests:
          - not_null
          - accepted_values:
              values: [Servicio, Quiebre, 'Sin existencia', 'Sin rotación comercial', Ocioso, Sano, Lento]
      - name: es_ocioso
        data_tests: [not_null]
      - name: es_quiebre
        data_tests: [not_null]

  - name: estado_carga
    description: >
      Frescura del dato por (empresa, dominio). Separa dos relojes que no significan lo mismo:
      `ultima_extraccion` dice si el pipeline está vivo y `fecha_dato_mas_reciente` si el ERP
      tiene operación al día. Se lee de Plata porque Oro no arrastra `extraido_en`.
    columns:
      - name: dominio
        data_tests: [not_null]
      - name: ultima_extraccion
        data_tests: [not_null]
      - name: estado_frescura
        data_tests:
          - not_null
          - accepted_values: { values: ['Al día', Atrasado, Desactualizado] }

  - name: dim_anio
    description: >
      Dimensión Año: el puente entre lo que se mide por día y lo que se clasifica por año.
      Evita un muchos-a-muchos contra el calendario, que Power BI resuelve filtrando en ambas
      direcciones. Filtrar aquí acota a la vez las clasificaciones y —vía el calendario— los
      hechos; al revés no propaga, que es lo correcto para una clase anual.
    columns:
      - name: anio_clave
        data_tests: [not_null, unique]

  - name: metrica_valor
    description: >
      Métricas certificadas en formato largo — (empresa, dominio, métrica, período) → valor.
      Es el CONTRATO DEL AGENTE DE IA (consulta por clave, jamás arma SQL) y la base de la
      validación contra el ERP; las claves coinciden EXACTAMENTE con
      metadatos.catalogo_metricas del metadata-store. En Power BI las mismas definiciones
      viven como medidas DAX sobre los hechos: esta tabla no alimenta visuales.
    columns:
      - name: empresa_id
        description: Sociedad a la que pertenece el valor. Eje del RLS del agente.
        data_tests: [not_null]
      - name: dominio
        description: Dominio de negocio del catálogo; agrupa las claves para la autorización por alcances.
        data_tests:
          - not_null
          - accepted_values:
              values: [ventas, compras, tesoreria, rentabilidad, inventario, pedidos]
      - name: metrica_clave
        description: Clave canónica de la métrica (= metadatos.catalogo_metricas.clave).
        data_tests: [not_null]
      - name: metrica_nombre
        data_tests: [not_null]
      - name: periodo
        description: Mes calendario 'YYYY-MM'. Los saldos (cartera, inventario, backlog) usan el mes del corte.
        data_tests: [not_null]
      - name: valor
        description: Valor en moneda de PRESENTACIÓN del grupo (el cuadre en moneda local vive en Plata).
        data_tests: [not_null]

  # ── Claves de dimensión: la guarda que faltaba ───────────────────────────────────────────
  # Toda dimensión ocupa el lado UNO de sus relaciones en Power BI, así que su clave tiene que
  # ser única SIEMPRE. Estos tests no existían y el modelo llegó a producción con
  # `dim_direccion` duplicada: dbt pasó 195/195 y el fallo apareció al refrescar el reporte,
  # que es el peor lugar para enterarse. Una clave repetida aquí es un defecto bloqueante, no
  # un aviso — por eso el test vive junto al modelo y no en una revisión manual.

  - name: dim_direccion
    description: >
      Geografía de la operación: una fila por dirección registrada del socio (entrega,
      facturación o principal). El hecho de ventas cruza por la dirección de ENTREGA, que
      responde "¿a dónde se vende?" — distinto de "¿quién compra?". Es la única dimensión con
      coordenadas. El departamento viene del catálogo OCST, cuya clave es compuesta
      (Code, Country): ver la cabecera de `plata_direccion` para el porqué del join en dos
      niveles.
    columns:
      - name: direccion_clave
        data_tests: [not_null, unique]

  - name: dim_cliente
    columns:
      - name: cliente_clave
        data_tests: [not_null, unique]

  - name: dim_producto
    columns:
      - name: producto_clave
        data_tests: [not_null, unique]

  - name: dim_proveedor
    columns:
      - name: proveedor_clave
        data_tests: [not_null, unique]

  - name: dim_socio_negocio
    columns:
      - name: socio_clave
        data_tests: [not_null, unique]

  - name: dim_vendedor
    columns:
      - name: vendedor_clave
        data_tests: [not_null, unique]

  - name: dim_organizacion
    columns:
      - name: organizacion_clave
        data_tests: [not_null, unique]

  - name: dim_moneda
    columns:
      - name: moneda_clave
        data_tests: [not_null, unique]

  - name: dim_almacen
    columns:
      - name: almacen_clave
        data_tests: [not_null, unique]

  - name: dim_centro_costo
    columns:
      - name: centro_costo_clave
        data_tests: [not_null, unique]

  - name: dim_tipo_documento
    columns:
      - name: tipo_documento_clave
        data_tests: [not_null, unique]

  - name: dim_tiempo
    columns:
      - name: tiempo_clave
        data_tests: [not_null, unique]
