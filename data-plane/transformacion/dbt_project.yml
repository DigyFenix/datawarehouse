name: cresta_dw
version: "0.2.0"
config-version: 2

# Perfil de conexión (ver profiles.yml.example). El profiles.yml real va fuera del repo
# o en ~/.dbt/ y NUNCA se versiona con credenciales.
profile: cresta_dw

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Versionado de maestros (SCD2). Espejo de metadatos.politica_ingesta.columnas_versionado:
# el portal es la fuente de verdad; esta var alimenta el check_cols del snapshot (que se
# resuelve en parseo). El test tests/versionado_coincide_politica.sql detecta drift entre
# ambos. Al automatizar el portal→dbt, este valor se generará desde la política.
vars:
  cols_versionado_clientes: ["nombre", "region"]

# Medallion: Bronce -> Plata (canónico + calidad) -> Oro (estrella + métricas).
# Plata es la costura agnóstica (CLAUDE.md §6): no se salta.
# Nomenclatura española sin mezcla (canónico v2 §1).
models:
  cresta_dw:
    plata:
      +schema: plata
      +materialized: table
    oro:
      +schema: oro
      +materialized: table

# El canónico v1 (documento_venta / documento_cobro / item, prefijos silver_ y fct_)
# y los seeds sintéticos estilo SAP B1 se conservan como referencia histórica en
# `_retirado_v1/`, FUERA de las rutas que dbt escanea (no compilan, no estorban).
# Reemplazados por el canónico v2: data-plane/canonico/DISENO-plata-oro.md
# La extracción real desde HANA y Odoo alimenta `bronce` directamente.
seeds:
  cresta_dw:
    +schema: bronce
    # Calendario oficial de feriados (referencia del motor, no dato del ERP). dim_tiempo lo
    # cruza para es_feriado/es_dia_habil. Al entrar un tenant fuera de Guatemala, se agrega
    # su calendario como otro seed y una columna de país.
    feriados_guatemala:
      +column_types:
        fecha: date
        nombre: text
        es_medio_dia: boolean
