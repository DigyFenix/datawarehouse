name: quilate_control
version: "0.2.0"
config-version: 2

# Perfil de conexión (ver profiles.yml.example). El profiles.yml real va fuera del repo
# o en ~/.dbt/ y NUNCA se versiona con credenciales.
profile: quilate_control

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Versionado de maestros (SCD2). Espejo de metadatos.politica_ingesta.columnas_versionado:
# el portal es la fuente de verdad; esta var alimenta el check_cols del snapshot (que se
# resuelve en parseo). El test tests/versionado_coincide_politica.sql detecta drift entre
# ambos. Al automatizar el portal→dbt, este valor se generará desde la política.
vars:
  cols_versionado_clientes: ["nombre", "region"]

# Medallion: Bronce -> Plata (canónico + calidad) -> Oro (estrella + métricas).
# Plata es la costura agnóstica (CLAUDE.md §6): no se salta.
# Nomenclatura española sin mezcla (canónico v2 §1).
models:
  quilate_control:
    plata:
      +schema: plata
      +materialized: table
    oro:
      +schema: oro
      +materialized: table
      # RLS del consumo gobernado (agente de IA): cada build recrea las policies y el
      # GRANT SELECT para el rol portal_lector (fail-closed sin `app.empresas`). Si el
      # rol no existe en el clúster, la macro no hace nada (no usa +grants de dbt a
      # propósito: un GRANT a rol inexistente tumbaría el build). dbt y Power BI no se
      # ven afectados (dueño/superusuario). Ver macros/aplicar_rls_oro.sql.
      +post-hook: "{{ aplicar_rls_oro() }}"

# El canónico v1 (documento_venta / documento_cobro / item, prefijos silver_ y fct_)
# y los seeds sintéticos estilo SAP B1 se conservan como referencia histórica en
# `_retirado_v1/`, FUERA de las rutas que dbt escanea (no compilan, no estorban).
# Reemplazados por el canónico v2: data-plane/canonico/DISENO-plata-oro.md
# La extracción real desde HANA y Odoo alimenta `bronce` directamente.
seeds:
  quilate_control:
    +schema: bronce
    # Calendario oficial de feriados por PAÍS (referencia del motor, no dato del ERP).
    # dim_tiempo cruza las filas del país del tenant (var `pais_feriados`, default GT)
    # para es_feriado/es_dia_habil. Un tenant de otro país = agregar sus filas a este
    # CSV con su código de país y pasar la var; el motor no cambia.
    feriados:
      +column_types:
        fecha: date
        nombre: text
        es_medio_dia: boolean
        pais: text
