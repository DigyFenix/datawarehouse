# Plano de datos local — Grupo Cresta (Fase 0)
# Levanta Postgres (medallion + metadata) y pgAdmin para inspección.
# Todos los valores sensibles vienen del .env de la raíz del repo (NO versionado).
name: cresta-dw

services:
  postgres:
    image: postgres:16-alpine
    container_name: cresta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      # Scripts de init: se ejecutan SOLO en el primer arranque (BD vacía).
      - ./init:/docker-entrypoint-initdb.d:ro
      # DDL versionado del catálogo (fuente de verdad); lo aplica 02_aplicar_catalogo.sh
      - ../../metadata-store:/opt/metadata-store:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cresta-pgadmin
    restart: unless-stopped
    profiles: ["tools"]   # opcional: `docker compose --profile tools up -d`
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Portal — API (plano de control). Perfil "portal": `docker compose --profile portal up -d`
  api:
    build:
      context: ../../control-plane/api
    container_name: cresta-portal-api
    restart: unless-stopped
    profiles: ["portal"]
    environment:
      NODE_ENV: production
      API_PORT: 3001
      POSTGRES_HOST: postgres          # nombre del servicio en la red de Docker
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRA_EN: ${JWT_EXPIRA_EN}
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD}
    ports:
      - "${API_PORT}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Portal — Web (frontend Angular servido por nginx, proxy /api -> api).
  web:
    build:
      context: ../../control-plane/portal
    container_name: cresta-portal-web
    restart: unless-stopped
    profiles: ["portal"]
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
