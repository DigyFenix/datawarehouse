# Plano de datos local — Grupo Cresta (Fase 0)
# Levanta Postgres (medallion + metadata) y pgAdmin para inspección.
# Todos los valores sensibles vienen del .env de la raíz del repo (NO versionado).
name: cresta-dw

services:
  postgres:
    image: postgres:16-alpine
    container_name: cresta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Rol de solo lectura para el consumo gobernado (agente de IA); lo crea
      # init/03_rol_lector.sh en el primer arranque. Sin la var, se omite.
      PORTAL_LECTOR_PASSWORD: ${PORTAL_LECTOR_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volumen Docker NATIVO (no bind mount): sobre NTFS/WSL2 el bind mount provoca
      # `FileFallocate: Interrupted system call` al extender archivos grandes y tumba
      # modelos pesados de dbt. Mismo patrón que infra/produccion/docker-compose.yml.
      - pgdata:/var/lib/postgresql/data
      # Scripts de init: se ejecutan SOLO en el primer arranque (BD vacía).
      - ./init:/docker-entrypoint-initdb.d:ro
      # DDL versionado del catálogo (fuente de verdad); lo aplica 02_aplicar_catalogo.sh
      - ../../metadata-store:/opt/metadata-store:ro
      # Seeds propios de cada tenant (datos de organización, sociedades, políticas):
      # NO se aplican en el init — se aplican a mano en el onboarding de cada organización.
      - ../../organizaciones:/opt/organizaciones:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cresta-pgadmin
    restart: unless-stopped
    profiles: ["tools"]   # opcional: `docker compose --profile tools up -d`
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # El TLD .local es "special-use": pgAdmin lo rechaza salvo que se permita explícitamente.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['grupocresta.local', 'ejemplo.local', 'local']"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Portal — API (plano de control). Perfil "portal": `docker compose --profile portal up -d`
  api:
    build:
      context: ../../control-plane/api
    container_name: cresta-portal-api
    restart: unless-stopped
    profiles: ["portal"]
    environment:
      NODE_ENV: production
      API_PORT: 3001
      POSTGRES_HOST: postgres          # nombre del servicio en la red de Docker
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRA_EN: ${JWT_EXPIRA_EN}
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD}
      # URL del worker del plano de datos (introspección/extracción).
      WORKER_URL: http://worker:3010
      # Tope de espera de una corrida del worker. Un `dbt build` con volumen real tarda
      # minutos; por debajo de eso el portal reporta un fallo que no ocurrió.
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-1800000}
    ports:
      - "${API_PORT}:3001"
    volumes:
      # DDL y seeds del repo (read-only): el botón "Provisionar" aplica los
      # MISMOS archivos versionados a la base del tenant nuevo. Sin este montaje
      # el endpoint responde que no está disponible, no falla a medias.
      - ../../metadata-store:/opt/metadata-store:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Portal — Web (frontend Angular servido por nginx, proxy /api -> api).
  web:
    build:
      context: ../../control-plane/portal
    container_name: cresta-portal-web
    restart: unless-stopped
    profiles: ["portal"]
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api

  # Portal de USUARIO — API (consumo). Resuelve el tenant por hash y opera sobre
  # el esquema `portal` de la base de cada tenant.
  api-usuario:
    build:
      # Contexto en la RAÍZ del repo: la API depende de @pulso/agente vía
      # "file:../../../data-plane/agente" (consumo/portal/api/package.json), y el
      # Dockerfile necesita ambas carpetas con la misma estructura relativa que en
      # desarrollo local (ver comentario al inicio del Dockerfile).
      context: ../../
      dockerfile: consumo/portal/api/Dockerfile
    container_name: cresta-portal-usuario-api
    restart: unless-stopped
    profiles: ["portal"]
    environment:
      NODE_ENV: production
      PORTAL_USUARIO_PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Secreto PROPIO del portal de usuario (distinto del JWT_SECRET del admin).
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET}
      PORTAL_JWT_EXPIRA_EN: ${PORTAL_JWT_EXPIRA_EN:-8h}
      # Agente de IA (CLAUDE.md §11): sin ANTHROPIC_API_KEY el módulo responde 503
      # al postear un mensaje; el resto de la API funciona igual.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTE_MODELO: ${AGENTE_MODELO:-claude-opus-5}
      AGENTE_MAX_ITERACIONES: ${AGENTE_MAX_ITERACIONES:-6}
      AGENTE_MAX_TOKENS: ${AGENTE_MAX_TOKENS:-4096}
      # Rol de solo lectura `portal_lector` (RLS oro): mismo valor que crea el rol
      # en init/03_rol_lector.sh (servicio postgres, arriba en este archivo).
      PORTAL_LECTOR_PASSWORD: ${PORTAL_LECTOR_PASSWORD:-}
    ports:
      - "${PORTAL_USUARIO_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy

  # Portal de USUARIO — Web (Angular servido por nginx, proxy /api -> api-usuario).
  web-usuario:
    build:
      context: ../../consumo/portal/web
    container_name: cresta-portal-usuario-web
    restart: unless-stopped
    profiles: ["portal"]
    ports:
      - "${WEB_USUARIO_PORT:-8081}:80"
    depends_on:
      - api-usuario

  # Worker del plano de datos: introspección (y extracción). Read-only al ERP; escribe metadatos.
  worker:
    build:
      context: ../../data-plane/extraccion
    container_name: cresta-worker
    restart: unless-stopped
    profiles: ["portal"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Credenciales read-only de los ERP (solo referencia por nombre; el valor vive en el
      # .env de la raíz, nunca en el repo). Una pareja por tipo de origen.
      HANA_USER: ${HANA_USER}
      HANA_PASSWORD: ${HANA_PASSWORD}
      MSSQL_USER: ${MSSQL_USER:-}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
      ODOO_USER: ${ODOO_USER}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      # Transformación: proyecto dbt montado y ubicación del profiles.yml generado en runtime.
      DBT_PROJECT_DIR: /dbt
      DBT_PROFILES_DIR: /tmp/dbt
    volumes:
      # Proyecto dbt (modelos gobernados). El worker corre `dbt build` con la selección de la política.
      - ../../data-plane/transformacion:/dbt
    ports:
      - "${WORKER_PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Datos de Postgres en volumen nativo de Docker (ver comentario en el servicio postgres).
  # Migrado desde el bind mount ./data el 2026-08-07; el datadir viejo queda como respaldo.
  pgdata:
